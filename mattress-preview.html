    :root {
      --primary: #121316;
      --surface: #ffffff;
      --surface-subtle: #f8f7f4;
      --border: #e6e2da;
      --border-light: #f0eee9;
      --accent: #b48c48;
      --accent-deep: #8f6826;
      --sale-red: #d32f2f;
      --sale-bg: #fff1f0;
      --sale-badge: linear-gradient(135deg, #e53935 0%, #c62828 100%);
      --text-main: #1d1d1f;
      --text-muted: #6e6d7a;
      --text-light: #94939b;
      --gold-gradient: linear-gradient(135deg, #d4af37 0%, #aa7c11 100%);
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.04);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.07);
      --shadow-lg: 0 16px 36px rgba(0,0,0,0.1);

      --transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;

      color: var(--text-main);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }

    /* Top Banner */
    .top-bar {
      background: #19191b;
      color: #fff;
      padding: 10px 24px;
      font-size: 0.85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid rgba(255,255,255,0.1);
    }
    .top-bar .tagline {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .top-bar .live-dot {
      width: 8px;
      height: 8px;
      background: #4caf50;
      border-radius: 50%;
      box-shadow: 0 0 8px #4caf50;
      display: inline-block;
    }
    .top-bar .actions {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .lang-toggle {
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 20px;
      padding: 4px 12px;
      font-size: 0.8rem;
      cursor: pointer;
      font-weight: 600;
      transition: var(--transition);
    }
    .lang-toggle:hover {
      background: var(--accent);
      border-color: var(--accent);
    }

    /* Hero Section */
    .preview-hero {
      background: linear-gradient(180deg, #ffffff 0%, #f7f5f1 100%);
      padding: 50px 24px 40px;
      border-bottom: 1px solid var(--border);
      text-align: center;
    }
    .preview-hero .badge {
      display: inline-block;
      background: var(--sale-bg);
      color: var(--sale-red);
      font-weight: 700;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 6px 16px;
      border-radius: 30px;
      margin-bottom: 16px;
      border: 1px solid rgba(211, 47, 47, 0.2);
    }
    .preview-hero h1 {
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--primary);
      margin-bottom: 12px;
    }
    .preview-hero p {
      color: var(--text-muted);
      max-width: 680px;
      margin: 0 auto 20px;
      font-size: 1.05rem;
    }
    .filter-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 24px;
    }
    .filter-btn {
      background: #fff;
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-main);
      transition: var(--transition);
    }
    .filter-btn:hover, .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* Container & Grid */
    .container {
      max-width: 1300px;
      margin: 0 auto;
      padding: 48px 24px 90px;
    }
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 36px;
    }

    /* Product Card */
    .product-card {
      background: var(--surface);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      transition: var(--transition);
      position: relative;
    }
    .product-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
      border-color: #d1cbc0;
    }

    /* Image Box */
    .card-media {
      position: relative;
      height: 280px;
      background: #f3f1ed;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .product-card:hover .card-media img {
      transform: scale(1.04);
    }
    .sale-tag-badge {
      position: absolute;
      top: 14px;
      left: 14px;
      background: var(--sale-badge);
      color: #fff;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 5px 12px;
      border-radius: 6px;
      box-shadow: 0 4px 10px rgba(211,47,47,0.35);
      z-index: 2;
    }
    .origin-badge {
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(25,25,27,0.85);
      backdrop-filter: blur(8px);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 6px;
      z-index: 2;
    }

    /* Card Content */
    .card-body {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }
    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .card-code {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-deep);
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .card-warranty {
      font-size: 0.75rem;
      font-weight: 600;
      color: #2e7d32;
      background: #e8f5e9;
      padding: 2px 8px;
      border-radius: 4px;
    }
    .card-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--primary);
      line-height: 1.35;
      margin-bottom: 12px;
    }
    .card-desc {
      font-size: 0.9rem;
      color: var(--text-muted);
      line-height: 1.55;
      margin-bottom: 18px;
      min-height: 42px;
    }

    .features-list {
      list-style: none;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px dashed var(--border);
    }
    .features-list li {
      font-size: 0.84rem;
      color: #444349;
      margin-bottom: 6px;
      display: flex;
      align-items: flex-start;
      gap: 8px;
    }
    .features-list li::before {
      content: "✓";
      color: var(--accent-deep);
      font-weight: 800;
      flex-shrink: 0;
    }

      margin-bottom: 18px;
    }
    .size-label {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
      display: block;
    }
    .size-buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .size-btn {
      flex: 1;
      min-width: 70px;
      padding: 7px 10px;
      background: var(--surface-subtle);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-main);
      cursor: pointer;
      text-align: center;
      transition: var(--transition);
    }
    .size-btn:hover {
      border-color: var(--primary);
    }
    .size-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);

      background: #faf8f5;
      border: 1px solid #eee7dc;
      padding: 14px 16px;
      border-radius: 8px;
      margin-top: auto;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;

    .price-main {
      display: flex;
      flex-direction: column;
    }
    .price-dimension {
      font-size: 0.78rem;
      color: var(--text-light);
      margin-bottom: 4px;
    }
    .price-values {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }
    .special-price {
      font-size: 1.6rem;
      font-weight: 800;
      color: var(--sale-red);
      line-height: 1;
    }
    .special-label {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--sale-red);
      background: var(--sale-bg);
      padding: 2px 6px;
      border-radius: 4px;
    }
    .regular-price {
      font-size: 0.95rem;
      color: var(--text-light);
      text-decoration: line-through;
    }
    .save-amount {
      font-size: 0.78rem;
      font-weight: 700;
      color: #c62828;
      margin-top: 4px;
    }

    /* Card Footer Action */
    .card-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

      flex: 1;
      background: var(--primary);
      color: #fff;
      text-align: center;
      text-decoration: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.86rem;
      font-weight: 600;
      transition: var(--transition);
    }
    .btn-inquire:hover {
      background: var(--accent-deep);

    .btn-copy {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.82rem;
      font-weight: 600;
      transition: var(--transition);
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-copy:hover {
      background: #f0ede6;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #19191b;
      color: #fff;
      padding: 12px 22px;
      border-radius: 8px;
      font-size: 0.88rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 2000;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
  </style>
</head>

    function renderProducts(filter = 'all') {
      const grid = document.getElementById('products-grid');
      grid.innerHTML = '';

      const filtered = filter === 'all' 
        ? productsData 
        : productsData.filter(p => p.typeKey === filter);

      filtered.forEach((p) => {
        const selVar = p.variants[p.selectedIdx];
        const isSpecialNumber = typeof selVar.special === 'number';

        const card = document.createElement('article');
        card.className = 'product-card';
        card.id = `card-${p.id}`;

        const features = currentLang === 'zh' ? p.featuresZh : p.featuresEn;
        const featuresHtml = features.map(f => `<li>${f}</li>`).join('');

        const sizeButtonsHtml = p.variants.map((v, vIdx) => `
          <button class="size-btn ${vIdx === p.selectedIdx ? 'active' : ''}" 
                  onclick="selectSize('${p.id}', ${vIdx})">
            ${v.size}
          </button>
        `).join('');

        const regularPriceHtml = selVar.regular 
          ? `<span class="regular-price">$${selVar.regular.toLocaleString()}</span>` 
          : '';

        const savingsHtml = (selVar.regular && isSpecialNumber) 
          ? `<div class="save-amount">${currentLang === 'zh' ? '立省' : 'Save'} $${(selVar.regular - selVar.special).toLocaleString()}</div>` 
          : '';

        const displaySpecial = isSpecialNumber 
          ? `$${selVar.special.toLocaleString()}` 
          : selVar.special;

        const note = currentLang === 'zh' ? selVar.noteZh : selVar.noteEn;
        const categoryLabel = currentLang === 'zh' ? '经典床垫' : 'Classic Mattress';

        card.innerHTML = `
          <div class="card-media">
            <span class="sale-tag-badge">🔥 ${currentLang === 'zh' ? '特价' : 'SPECIAL PRICE'}</span>
            <span class="origin-badge">${currentLang === 'zh' ? p.originZh : p.originEn}</span>
            <img src="${p.img}" alt="${currentLang === 'zh' ? p.titleZh : p.titleEn}" onerror="this.src='assets/images/collection-bedroom.jpg'">
          </div>
          <div class="card-body">
            <div class="card-meta">
              <span class="card-code">${p.code}</span>
              <span style="background: #eef2ff; color: #3b82f6; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 4px; border: 1px solid rgba(59,130,246,0.2);">
                🏷️ ${categoryLabel}
              </span>
              <span class="card-warranty">${currentLang === 'zh' ? p.warrantyZh : p.warrantyEn}</span>
            </div>
            <h3 class="card-title">${currentLang === 'zh' ? p.titleZh : p.titleEn}</h3>
            <p class="card-desc">${currentLang === 'zh' ? p.descZh : p.descEn}</p>
            
            <ul class="features-list">
              ${featuresHtml}
            </ul>

            <div class="size-selector-wrap">
              <span class="size-label">${currentLang === 'zh' ? '选择规格尺寸' : 'SELECT SIZE'}:</span>
              <div class="size-buttons">
                ${sizeButtonsHtml}
              </div>
            </div>

            <div class="price-box">
              <div class="price-main">
                <span class="price-dimension">规格: ${selVar.dim}</span>
                <div class="price-values">
                  <span class="special-price">${displaySpecial}</span>
                  <span class="special-label">${currentLang === 'zh' ? '特价' : 'Sale'}</span>
                  ${regularPriceHtml}
                </div>
                ${savingsHtml}
              </div>
              <span style="font-size:0.75rem; color:#856404; background:#fff3cd; padding:4px 8px; border-radius:4px; font-weight:600;">
                ${note}
              </span>
            </div>

            <div class="card-actions">
              <a href="tel:+19177715493" class="btn-inquire">
                📞 ${currentLang === 'zh' ? '电话订购 / 咨询特价' : 'Call 917-771-5493'}
              </a>
              <button class="btn-copy" onclick="copyCardData('${p.id}')" title="复制JSON数据">
                📋 复制数据
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function selectSize(productId, variantIdx) {
      const p = productsData.find(item => item.id === productId);
      if (p) {
        p.selectedIdx = variantIdx;
        const activeFilter = document.querySelector('.filter-btn.active').getAttribute('onclick').match(/'(.*?)'/)[1];
        renderProducts(activeFilter);
      }
    }

    function filterProducts(category, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderProducts(category);
    }

    function toggleLanguage() {
      currentLang = currentLang === 'zh' ? 'en' : 'zh';
      const langBtn = document.getElementById('lang-btn');
      
      if (currentLang === 'en') {
        langBtn.textContent = '切换为中文';
        document.getElementById('top-title').textContent = 'Yifa Furniture | Classic Mattresses Special Sale Preview';
        document.getElementById('hero-badge').textContent = '🔥 CLASSIC MATTRESSES · SPECIAL SALE PREVIEW';
        document.getElementById('hero-h1').textContent = 'Classic Mattresses Collection · Special Sale';
        document.getElementById('hero-sub').textContent = 'Unified under "Classic Mattresses" (slug: classic-mattresses). Featuring reversible semi-palm, 9" firm coir, 11" latex pillow top, 5-star hotel dual-sided, and Beautyrest Black Series 1. Click sizes for real-time pricing and structured data.';
        document.getElementById('flt-all').textContent = 'All Classic Mattresses (6)';
        document.getElementById('flt-coir').textContent = 'Orthopedic Coir (3)';
        document.getElementById('flt-latex').textContent = 'Latex Pocket Spring (1)';
        document.getElementById('flt-hotel').textContent = '5-Star Hotel (1)';
        document.getElementById('flt-br').textContent = 'Beautyrest Black (1)';
      } else {
        langBtn.textContent = 'Switch to English';
        document.getElementById('top-title').textContent = 'Yifa Furniture | 经典床垫特价上架预览中心';
        document.getElementById('hero-badge').textContent = '🔥 经典床垫专区 · CLASSIC MATTRESSES PREVIEW';
        document.getElementById('hero-h1').textContent = '经典床垫 (Classic Mattresses) · 特价上架展示';
        document.getElementById('hero-sub').textContent = '统一归入「经典床垫」类目（slug: classic-mattresses）。涵盖 4"/6" 双面半棕护脊、9" 弹簧椰棕硬垫、11" 乳胶 Pillow Top、五星级酒店双面款及美国席梦思黑标 Series I。点击尺寸即时查看特价与结构化数据。';
        document.getElementById('flt-all').textContent = '全部经典床垫 (6)';
        document.getElementById('flt-coir').textContent = '天然椰棕护脊 (3)';
        document.getElementById('flt-latex').textContent = '高弹乳胶独立袋装 (1)';
        document.getElementById('flt-hotel').textContent = '五星级酒店系列 (1)';
        document.getElementById('flt-br').textContent = '席梦思黑标奢华款 (1)';
      }

      const activeFilter = document.querySelector('.filter-btn.active').getAttribute('onclick').match(/'(.*?)'/)[1];
      renderProducts(activeFilter);
    }

    function copyCardData(productId) {
      const p = productsData.find(item => item.id === productId);
      if (!p) return;
      const jsonStr = JSON.stringify(p, null, 2);
      navigator.clipboard.writeText(jsonStr).then(() => {
        const toast = document.getElementById('toast');
        toast.textContent = `已成功复制【${p.code}】（经典床垫）结构化数据！`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2500);
      });
    }

    // 初始化渲染
    document.addEventListener('DOMContentLoaded', () => {
      renderProducts('all');
    });
  </script>
