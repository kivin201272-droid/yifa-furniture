<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 750px;
    height: 1200px;
    background: #f4efe6;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "STHeiti", sans-serif;
    display: flex;
    flex-direction: column;
    padding: 44px 50px 38px;
    color: #2b2520;
    position: relative;
    overflow: hidden;
    justify-content: space-between;
  }
  .badge-top {
    display: inline-block;
    align-self: center;
    background: #8e6d3d;
    color: #fff;
    padding: 8px 24px;
    border-radius: 24px;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: 0.1em;
    margin-bottom: 10px;
  }
  .main-box {
    background: #fff;
    border-radius: 12px;
    padding: 24px 20px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.06);
    border: 1px solid #e2ddd3;
    text-align: center;
  }
  .main-h1 {
    font-size: 64px;
    font-weight: 900;
    color: #2b2520;
    line-height: 1.15;
    letter-spacing: 0.04em;
  }
  .main-sub {
    font-size: 48px;
    font-weight: 800;
    color: #8e6d3d;
    line-height: 1.2;
    margin-top: 8px;
    letter-spacing: 0.02em;
  }
  .anniversary-box {
    background: #2b2520;
    color: #fff;
    border-radius: 12px;
    padding: 22px 18px;
    text-align: center;
    box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    margin: 14px 0;
  }
  .anniversary-title {
    font-size: 44px;
    font-weight: 900;
    color: #f7d58b;
    letter-spacing: 0.04em;
    margin-bottom: 6px;
  }
  .action-heading {
    font-size: 48px;
    font-weight: 900;
    color: #fff;
    letter-spacing: 0.02em;
  }
  .deadline-tag {
    display: inline-block;
    background: rgba(255,255,255,0.15);
    border: 1px solid rgba(255,255,255,0.3);
    color: #e5dfd5;
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 23px;
    margin-top: 12px;
    font-weight: 600;
  }
  .contact-card {
    background: #fff;
    border-radius: 12px;
    padding: 22px;
    border: 1px solid #e2ddd3;
    box-shadow: 0 6px 18px rgba(0,0,0,0.06);
  }
  .contact-h3 {
    font-size: 32px;
    font-weight: 800;
    color: #2b2520;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .contact-h3::before {
    content: "";
    display: inline-block;
    width: 6px;
    height: 26px;
    background: #8e6d3d;
    border-radius: 3px;
  }
  .contact-p {
    font-size: 24px;
    color: #5d564f;
    line-height: 1.5;
    margin-bottom: 8px;
  }
  .contact-bottom {
    border-top: 1px dashed #dcd6cb;
    padding-top: 10px;
    margin-top: 10px;
    font-size: 23px;
    font-weight: 700;
    color: #2b2520;
    display: flex;
    justify-content: space-between;
  }
</style>
</head>
<body>
  <div class="badge-top">32周年庆 · 典承经典</div>
  
  <div class="main-box">
    <div class="main-h1">家具批发</div>
    <div class="main-sub">一件也是批发价</div>
  </div>

  <div class="anniversary-box">
    <div class="anniversary-title">32周年庆 典承经典</div>
    <div class="action-heading">$100万家具让大行动</div>
    <div class="deadline-tag">活动截止日期: 2026年9月30日</div>
  </div>

  <div class="contact-card">
    <div class="contact-h3">订货与联系方式</div>
    <p class="contact-p">批发价的产品，须提前一周订货，请亲临本店指定地点自提货物。</p>
    <div class="contact-bottom">
      <span>电话: 917-771-5493</span>
      <span>地址: 6410 8th Ave, Brooklyn</span>
    </div>
  </div>
</body>
</html>
